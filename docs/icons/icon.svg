<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Rhizosphere">
  <defs>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d5c3a"/>
      <stop offset="28%" stop-color="#2a1f16"/>
      <stop offset="100%" stop-color="#1a120c"/>
    </linearGradient>
    <radialGradient id="exude" cx="46%" cy="48%" r="22%">
      <stop offset="0%" stop-color="#7a9e6e" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7a9e6e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#soil)"/>
  <!-- grass -->
  <g stroke="#5a8a52" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M80 150 Q90 110 86 70"/>
    <path d="M120 155 Q135 115 128 75"/>
    <path d="M160 148 Q168 108 162 68"/>
    <path d="M380 150 Q392 112 386 72"/>
    <path d="M420 155 Q430 118 424 78"/>
    <path d="M460 148 Q472 110 466 70"/>
  </g>
  <line x1="40" y1="160" x2="472" y2="160" stroke="#a89070" stroke-width="4" opacity="0.45"/>
  <!-- root -->
  <path d="M256 158 C248 220 270 280 240 340 C220 380 230 430 218 470"
        stroke="#e8dcc8" stroke-width="18" fill="none" stroke-linecap="round"/>
  <path d="M240 340 C180 320 140 360 110 390" stroke="#c4a878" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M240 340 C300 310 350 360 380 400" stroke="#c4a878" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- exudate glow -->
  <circle cx="236" cy="290" r="70" fill="url(#exude)"/>
  <!-- nodules -->
  <ellipse cx="150" cy="360" rx="16" ry="12" fill="#6aad7a"/>
  <ellipse cx="172" cy="378" rx="12" ry="10" fill="#4a7c59"/>
  <!-- AMF hint -->
  <path d="M380 400 C340 370 300 350 270 330" stroke="#a888b8" stroke-width="4" fill="none" opacity="0.75"/>
  <circle cx="236" cy="290" r="10" fill="#7a9e6e"/>
</svg>
